<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Digital ID | School</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
--bg:#0A0A0A;
--panel:#151515;
--panel2:#1E1E1E;
--line:#2C2C2C;
--white:#F5F5F5;
--muted:#8A8A8A;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{

background:var(--bg);
color:var(--white);
font-family:'Inter',sans-serif;

min-height:100vh;
display:flex;
justify-content:center;
padding:30px 15px;

}


.app{

width:100%;
max-width:420px;

}


.hidden{

display:none!important;

}


.brand{

text-align:center;
margin-bottom:25px;

}


.mark{

width:45px;
height:45px;

border:2px solid white;
border-radius:50%;

display:flex;
align-items:center;
justify-content:center;

margin:auto;

font-weight:800;

}


.school{

margin-top:12px;
font-size:11px;
letter-spacing:3px;
color:var(--muted);

}


.brand h1{

font-size:21px;
margin-top:5px;

}



.login-panel{

background:var(--panel);

border:1px solid var(--line);

padding:30px 25px;

border-radius:16px;

}



.field{

margin-bottom:18px;

}



.field label{

display:block;

font-size:11px;

color:var(--muted);

letter-spacing:1px;

margin-bottom:8px;

}



.field input{

width:100%;

padding:14px;

background:var(--panel2);

border:1px solid var(--line);

border-radius:10px;

color:white;

font-size:15px;

}



.field input:focus{

outline:none;

border-color:white;

}



.btn{

width:100%;

padding:14px;

background:white;

color:black;

border:none;

border-radius:10px;

font-weight:700;

cursor:pointer;

}



.error{

color:#ff5555;

font-size:13px;

margin-top:10px;

}



.hint{

margin-top:20px;

padding-top:15px;

border-top:1px dashed var(--line);

text-align:center;

font-size:12px;

color:var(--muted);

}



/* ID CARD */

.id-card{

background:linear-gradient(160deg,#1e1e1e,#111);

border:1px solid var(--line);

border-radius:16px;

overflow:hidden;

}



.stripe{

height:6px;

background:white;

opacity:.2;

}



.card-head{

padding:20px;

display:flex;

justify-content:space-between;

}



.tag{

border:1px solid white;

border-radius:20px;

padding:4px 10px;

font-size:10px;

}



.card-body{

padding:20px;

text-align:center;

}



.avatar{

width:90px;

height:90px;

border-radius:50%;

border:2px solid white;

margin:auto;

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

font-weight:800;

}



.card-body h2{

margin-top:15px;

font-size:21px;

}



.details{

border-top:1px solid var(--line);

margin-top:20px;

padding-top:15px;

text-align:left;

}



.row{

display:flex;

justify-content:space-between;

margin-bottom:12px;

font-size:14px;

}



.label{

color:var(--muted);

}



.logout{

width:100%;

padding:13px;

margin-top:20px;

background:none;

color:white;

border:1px solid var(--line);

border-radius:10px;

}



</style>

</head>


<body>


<div class="app">


<div class="brand">

<div class="mark">
ID
</div>

<div class="school">
YOUR SCHOOL NAME
</div>

<h1>
Smart Digital ID
</h1>

</div>



<!-- LOGIN -->

<div id="loginScreen" class="login-panel">


<div class="field">

<label>
USERNAME
</label>

<input id="username" type="text">

</div>



<div class="field">

<label>
PASSWORD
</label>

<input id="password" type="password">

</div>



<button class="btn" onclick="attemptLogin()">

LOGIN

</button>


<div id="loginError" class="error"></div>


<div class="hint">

Username + Password use cheyth login cheyyuka.

</div>


</div>



<!-- CARD -->

<div id="cardScreen" class="hidden">

</div>



</div>

  <script type="module">

// Firebase Imports

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import { 
getFirestore,
doc,
getDoc
} from 
"https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";



// Firebase Configuration

const firebaseConfig = {

apiKey: "AIzaSyCUQH1ZVHhayNt89GY4gRgVfHf9oSP1qt4",

authDomain: "smart-digital-id-574d3.firebaseapp.com",

projectId: "smart-digital-id-574d3",

storageBucket: "smart-digital-id-574d3.firebasestorage.app",

messagingSenderId: "879102722268",

appId: "1:879102722268:web:63caf6013f2988bf1bf419",

measurementId: "G-1KBNT4KN2R"

};



// Initialize Firebase

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);



// Login Elements

const loginScreen = document.getElementById("loginScreen");

const cardScreen = document.getElementById("cardScreen");

const loginError = document.getElementById("loginError");





// LOGIN FUNCTION

window.attemptLogin = async function(){


const username = document
.getElementById("username")
.value
.trim()
.toLowerCase();


const password = document
.getElementById("password")
.value
.trim();



loginError.innerHTML="";



if(!username || !password){

loginError.innerHTML="Enter username and password";

return;

}



try{


// Firestore document check

const studentRef = doc(
db,
"students",
username
);



const studentSnap = await getDoc(studentRef);



if(studentSnap.exists()){


const student = studentSnap.data();



if(student.password === password){



// Save login

sessionStorage.setItem(
"student",
JSON.stringify(student)
);



// Open ID Card

showCard(student);



}

else{


loginError.innerHTML=
"Wrong password";


}



}

else{


loginError.innerHTML=
"Student not found";


}



}

catch(error){


console.log(error);

loginError.innerHTML=
"Database connection error";


}


}





</script>

  <script>

// Get initials for avatar

function getInitials(name){

return name
.split(" ")
.map(word=>word[0])
.join("")
.substring(0,2)
.toUpperCase();

}



// Show Student Card

window.showCard = function(student){


loginScreen.classList.add("hidden");

cardScreen.classList.remove("hidden");



cardScreen.innerHTML = `

<div class="id-card">


<div class="stripe"></div>


<div class="card-head">

<span>
YOUR SCHOOL NAME
</span>

<span class="tag">
STUDENT ID
</span>

</div>



<div class="card-body">


<div class="avatar">

${getInitials(student.name)}

</div>



<h2>
${student.name}
</h2>



<div style="color:#8A8A8A;margin-top:5px">

Class ${student.class}

</div>




<div class="details">


<div class="row">

<span class="label">
Date of Birth
</span>

<span>
${student.dob}
</span>

</div>



<div class="row">

<span class="label">
Blood Group
</span>

<span>
${student.blood}
</span>

</div>



<div class="row">

<span class="label">
Emergency Contact
</span>

<span>
${student.contact}
</span>

</div>


</div>




<div id="qrcode" style="
margin-top:20px;
display:flex;
justify-content:center;
"></div>



<button class="logout" onclick="logout()">

Logout

</button>



</div>


</div>

`;



// QR Code

const qrScript = document.createElement("script");

qrScript.src =
"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";


qrScript.onload = ()=>{


new QRCode(
document.getElementById("qrcode"),
{

text:
"Student ID : "+student.username,

width:90,

height:90

}

);


};


document.body.appendChild(qrScript);



}




// Logout

window.logout=function(){


sessionStorage.removeItem("student");


cardScreen.classList.add("hidden");

loginScreen.classList.remove("hidden");


document.getElementById("username").value="";

document.getElementById("password").value="";


}




// Auto login after refresh

window.onload=function(){


const saved =
sessionStorage.getItem("student");


if(saved){


showCard(JSON.parse(saved));


}


}



</script>


</body>

</html>
